<!DOCTYPE html> 

<html lang="he" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="icon" href="https://itaymotivation.github.io/MediaPublisher/ShiduchimIcon.jpg" type="image/png">
    <title>הצעה לשידוך</title>

    <style>

        * {

            box-sizing: border-box;

        }



        body, html { 

            margin: 0; 

            padding: 0; 

            width: 100%; 

            height: 100%; 

            display: flex; 

            flex-direction: column; 

            font-family: sans-serif; 

            overflow-x: hidden; 

        }

        

        /* אזור הכותרת מוצמד לראש הדף */

        #header-container {
            top: 0;

            z-index: 100; /* מוודא שזה מעל הכל */

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            background-color: #f9f9f9;

         /*   border-bottom: 2px solid #4f46e5;  קו הפרדה בצבע החדש */

            text-align: center;

            flex-shrink: 0;

        }



        /* כפתור חדש לצפייה בתמונה */
        #view-image-btn {
            display: none; /* מוצג רק אם קיימת תמונה */
            margin: 10px 0;
            padding: 10px 22px;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #b37b2d, #d4af37);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(179, 123, 45, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #view-image-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(179, 123, 45, 0.4);
        }



        #candidate-details {

            font-size: 1.1rem;

            color: #333;

            font-weight: bold;

            margin-top: 10px;

        }



        #tally-iframe { 

            flex-grow: 1; 

            width: 100%; 

            border: none;

            display: block; 
            
            min-height: -webkit-fill-available;
        }

        #candidate-telegramPost {
        white-space: pre-wrap;
        direction: rtl;
        width: min(800px, 95%);
        padding: 16px;
        margin: 12px 0;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,.08);
        font-size: 1rem;
        line-height: 1.8;
        word-break: break-word;
    }
    p{text-align: right;}
    #innerdiv{padding: 15px;}    
    @media (max-width: 480px) {
        #candidate-image {  object-fit: cover; border-radius: 0px 0px 25% 25%}
        #candidate-details { font-size: 1rem; }
    }

    </style>

</head>

<body>



    <div id="header-container">
        <h1>טופס אישור והתקדמות הצעה</h1>
        <button id="view-image-btn" type="button">📷 צפה בתמונת השידוך</button>
        <div id="innerdiv">
            <p id="candidate-name" alt="שם מועמד"></p>
            <p id="suggestion-name" alt="שם הצעה"></p>
        </div>  
        <p id="candidate-telegramPost" alt="פרטי מועמד"></p>
        <iframe id="tally-iframe"></iframe>
    </div>

   



  <script>

Swal.fire({
      title: 'טוען את הטופס...',
      allowOutsideClick: false,
      showConfirmButton: false,
      didOpen: () => {
        Swal.showLoading();
      }
    });

const urlParams = new URLSearchParams(window.location.search);
const viewImageBtn = document.getElementById("view-image-btn");
const candidateImg = document.getElementById("candidate-image");

const iframe = document.getElementById("tally-iframe");


const matchId = urlParams.get("matchId");

const gender = urlParams.get("gender");

var meetingNum = urlParams.get("meetingNum");


if (!matchId) {

    document.body.innerHTML =
    "<h2 style='text-align:center'>חסר MatchId</h2>";

    throw new Error("Missing matchId");
Swal.close(); // Close the loader
}


if (!gender) {

    document.body.innerHTML =
    "<h2 style='text-align:center'>חסר gender</h2>";

    throw new Error("Missing gender");
Swal.close(); // Close the loader
}



// Apps Script JSONP callback

window.receiveMatchData = function(data) {


    console.log("Match data:", data);


    if (!data.success) {

        document.body.innerHTML =
        "<h2 style='text-align:center'>בעיה בנתונים, יש לכתוב מייל לכתובת shiduchimt321@gmail.com</h2>";
Swal.close(); // Close the loader
        return;

    }

    const tallyParams = new URLSearchParams();

    var candidateName="";
    var suggestionName="";
    var meetingNum="";
    var suggestionTelegramPost="";
    var telegramPostText="";
    var src="";
    var isWomanImageExist="0";
    var isManImageExist="0";
    
    if(gender=="man"){
        candidateName = data.man.name;
        suggestionName = data.woman.name;
        suggestionTelegramPost = data.woman.telegramPost.replace(/👤 איש קשר:\s*\d+[\r\n]*/g, "");
        src = data.woman.image;
        womanImage = data.woman.image;
        manImage = data.man.image;
        if(womanImage!=""){
            isWomanImageExist="1";
        }
        if(manImage!=""){
            isManImageExist="1";
        }
    }else{
         candidateName = data.woman.name;
         suggestionName = data.man.name;
         suggestionTelegramPost =  data.man.telegramPost.replace(/👤 איש קשר:\s*\d+[\r\n]*/g, "");
         src = data.man.image;
        womanImage = data.woman.image;
        manImage = data.man.image;
        if(womanImage!=""){
            isWomanImageExist="1";
        }
        if(manImage!=""){
            isManImageExist="1";
        }
         document.getElementById("candidate-telegramPost").innerHTML=data.man.telegramPost.replace(/👤 איש קשר:\s*\d+[\r\n]*/g, "");
    }
    document.getElementById("candidate-telegramPost").textContent=suggestionTelegramPost;
    document.getElementById("candidate-name").innerHTML= `${candidateName} שלום רב, בהמשך לתהליך השידוכים שלכם בנוגע להצעה.`;
    document.getElementById("suggestion-name").innerHTML= `שם ההצעה: ${suggestionName}`;
    meetingNum = data.man.meetingNumber;

    tallyParams.set(
        "candidateName",
        candidateName || ""
    );
    
    tallyParams.set(
        "gender",
        gender || ""
    );


    tallyParams.set(
        "suggestionName",
        suggestionName || ""
    );


    tallyParams.set(
        "meetingNum",
        meetingNum || "0"
    );


    tallyParams.set(
        "matchId",
        matchId || ""
    );

    tallyParams.set(
        "isManImageExist",
        isManImageExist || ""
    );

     tallyParams.set(
        "isWomanImageExist",
        isWomanImageExist || ""
    );
    
    if (src && src.trim() !== "") {
    // 1. Preload image silently in background
    const imgPreload = new Image();
    imgPreload.src = src;

    viewImageBtn.style.display = "inline-block";

    // 2. Click handler displays cached image instantly
    viewImageBtn.addEventListener("click", function () {
        Swal.fire({
            title: `תמונת ${suggestionName}`,
            imageUrl: src,
            imageAlt: `תמונת ${suggestionName}`,
            confirmButtonText: 'סגור',
            confirmButtonColor: '#b37b2d'
        });
    });
}


    iframe.src =
    "https://tally.so/r/RGj87K?" +
    tallyParams.toString();



    delete window.receiveMatchData;


};




// JSONP call to Apps Script

const script = document.createElement("script");


script.src =

"https://script.google.com/macros/s/AKfycbzZ9nRxN3hl8VaUGT_RyYg0hhdD0S_3uKh9HMtw1mjGH4sliE6MchY_bTnaOmD30JMJ/exec"

+ "?action=doGet"

+ "&matchId=" + encodeURIComponent(matchId)

+ "&meetingNum=" + encodeURIComponent(meetingNum)

+ "&callback=receiveMatchData";




script.onload = function(){

    console.log(
        "Apps Script loaded successfully"
    );
Swal.close(); // Close the loader
};



script.onerror = function(){

    console.error(
        "Failed loading Apps Script"
    );
Swal.close(); // Close the loader
};



console.log(
    "Loading Apps Script URL:",
    script.src
);



// start request

document.body.appendChild(script);



</script>

</body>

</html>
